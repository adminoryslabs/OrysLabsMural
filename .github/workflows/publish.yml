name: Publish images

# Images are built here, never on the VPS: the server has 2 vCPU and may be
# serving a live class while a build runs. The server only ever pulls.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      yjs_url:
        description: Public websocket URL to inline into the client bundle
        required: false
        default: wss://collab.oryslabs.com/yjs

env:
  REGISTRY: ghcr.io
  # NEXT_PUBLIC_* values are inlined into the JavaScript bundle at build time,
  # so the public websocket URL must be known here. Same origin as the app, so
  # the browser sends the session cookie on the upgrade request.
  YJS_URL: ${{ github.event.inputs.yjs_url || 'wss://collab.oryslabs.com/yjs' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            target: runner
          - name: yjs
            target: yjs
          - name: migrator
            target: migrator

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # The commit tag is what the server pins to; `latest` is a convenience
          # for humans reading the registry, never for a deploy.
          tags: |
            ${{ env.REGISTRY }}/adminoryslabs/mural-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/adminoryslabs/mural-${{ matrix.name }}:latest
          build-args: |
            NEXT_PUBLIC_YJS_URL=${{ env.YJS_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
