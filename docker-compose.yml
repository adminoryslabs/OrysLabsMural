# Local development stack.
# Only Postgres runs here; the Next.js app runs on the host via `npm run dev`.
# Usage:  cp env.example .env && docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: mural-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mural_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mural}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mural_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mural} -d ${POSTGRES_DB:-mural}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mural_pgdata:
